# MISS_HIT configuration: https://misshit.org
# Code formatting is enforced with "mh_style --fix" (run by pre-commit).
# Rules below are switched off because they cannot be fixed automatically
# and would require renaming or rewriting existing code.
project_root

# end_of_statements would append ";" to statements, which silences
# output that some scripts print on purpose.
suppress_rule: "end_of_statements"

suppress_rule: "copyright_notice"
suppress_rule: "line_length"
suppress_rule: "naming_classes"
suppress_rule: "naming_functions"
suppress_rule: "naming_parameters"
suppress_rule: "naming_scripts"
suppress_rule: "unicode"
