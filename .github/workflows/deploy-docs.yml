name: Deploy MkDocs

on:
  push:
    branches:
      - main
  # Test changes to the image generation (images are uploaded as an
  # artifact, nothing is deployed)
  pull_request:
    paths:
      - docs/scripts/**
      - .github/workflows/deploy-docs.yml
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

env:
  MTEX_VERSION: 7.1.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Plot images for the docs are generated by docs/scripts/make_doc_images.m
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2024b
          products: >
            Signal_Processing_Toolbox
            Image_Processing_Toolbox
            Statistics_and_Machine_Learning_Toolbox
          cache: true

      - name: Download MTEX
        run: |
          curl -sSfL -o "$RUNNER_TEMP/mtex.zip" \
            "https://github.com/mtex-toolbox/mtex/releases/download/mtex-${MTEX_VERSION}/mtex-${MTEX_VERSION}.zip"
          unzip -q "$RUNNER_TEMP/mtex.zip" -d "$RUNNER_TEMP/mtex"
          MTEX_DIR=$(dirname "$(find "$RUNNER_TEMP/mtex" -name startup_mtex.m | head -1)")
          # mtexdata downloads the example datasets into this folder
          mkdir -p "$MTEX_DIR/data/EBSD"
          echo "MTEX_DIR=$MTEX_DIR" >> "$GITHUB_ENV"

      # Some ORTools functions dock their figures, which MATLAB only allows
      # with a display, so provide a virtual one
      - name: Start virtual display
        run: |
          sudo apt-get install -y -qq xvfb > /dev/null
          Xvfb :99 -screen 0 1920x1200x24 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Generate documentation images
        uses: matlab-actions/run-command@v2
        with:
          command: addpath(getenv('MTEX_DIR')); startup_mtex; addpath('docs/scripts'); make_doc_images

      - uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Cache dependencies
        run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV

      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-

      - name: Install dependencies
        run: pip install -r docs/requirements.txt

      - name: Build site
        run: mkdocs build --strict

      - name: Upload generated images for review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: doc-images
          path: |
            docs/images/
            docs/snippets/

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    if: github.event_name != 'pull_request'
    # Allow only one concurrent deployment
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
